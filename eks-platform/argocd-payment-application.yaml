apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: payment-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Macha-Narendra/devops-practice-lab1.git

    targetRevision: HEAD

    path: eks-platform/helm/payment-service

  destination:
    server: https://kubernetes.default.svc

    namespace: payment

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
